<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronVow</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: monospace;
}

/* ENTRY */
#entry {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: url("https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1") center/cover;
    position: relative;
}

#entry::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,30,0.85);
}

#entry::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(0,150,255,0.2), transparent 60%);
    animation: moveLight 10s linear infinite;
}

@keyframes moveLight {
    0% { transform: translate(-20%, -20%); }
    50% { transform: translate(20%, 20%); }
    100% { transform: translate(-20%, -20%); }
}

.enter {
    z-index: 2;
    font-size: 26px;
    cursor: pointer;
}

/* PASSWORD */
#passwordBox, #access {
    display: none;
    z-index: 2;
    text-align: center;
}

input {
    padding: 10px;
    margin-top: 10px;
    background: black;
    border: 1px solid white;
    color: white;
}

button {
    padding: 10px;
    margin-top: 10px;
    cursor: pointer;
    width: 100%;
}

/* STORE */
#store {
    display: none;
    padding: 20px;
    background: #0a0a0a;
    min-height: 100vh;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.card {
    background: #111;
    padding: 10px;
    text-align: center;
}

img {
    width: 100%;
    border-radius: 8px;
}

/* CART */
#cartBox {
    display: none;
    background: #111;
    padding: 15px;
    margin-top: 20px;
}

/* MOBILE */
@media (max-width: 600px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entry">
    <div class="enter" onclick="showPassword()">> ENTER</div>

    <div id="passwordBox">
        <p>ENTER PASSWORD</p>
        <input type="password" id="pass">
        <button onclick="checkPass()">Submit</button>
    </div>

    <div id="access"></div>
</div>

<!-- STORE -->
<div id="store">

    <h2>IronVow</h2>

    <p onclick="toggleCart()" style="cursor:pointer;">
        Cart (<span id="cartCount">0</span>) - KES <span id="total">0</span>
    </p>

    <div class="grid">

        <!-- REPLACE IMAGES WITH YOUR CANVA EXPORTS -->
        <div class="card">
            <img src="tee.png">
            <h3>Iron Tee</h3>
            <p>KES 1200</p>
            <button onclick="addCart('Iron Tee',1200)">Add</button>
        </div>

        <div class="card">
            <img src="hoodie.png">
            <h3>Warrior Hoodie</h3>
            <p>KES 3500</p>
            <button onclick="addCart('Warrior Hoodie',3500)">Add</button>
        </div>

        <div class="card">
            <img src="cap.png">
            <h3>Minimal Cap</h3>
            <p>KES 900</p>
            <button onclick="addCart('Minimal Cap',900)">Add</button>
        </div>

    </div>

    <!-- CART -->
    <div id="cartBox">
        <h3>Your Cart</h3>
        <ul id="cartItems"></ul>
        <p>Total: KES <span id="cartTotal">0</span></p>
        <button onclick="checkout()">Checkout (M-Pesa)</button>
    </div>

</div>

<audio id="sound" src="https://www.soundjay.com/button/sounds/button-09.mp3"></audio>

<script>
let cart = [];
let total = 0;
let password = "iron"; // CHANGE THIS

function showPassword(){
    document.querySelector(".enter").style.display="none";
    document.getElementById("passwordBox").style.display="block";
}

function checkPass(){
    let input = document.getElementById("pass").value;

    if(input === password){
        document.getElementById("sound").play();
        typeAccess();
    } else {
        alert("ACCESS DENIED");
    }
}

function typeAccess(){
    document.getElementById("passwordBox").style.display="none";
    let text="ACCESS GRANTED";
    let i=0;
    let access=document.getElementById("access");
    access.style.display="block";

    let typing=setInterval(()=>{
        access.innerHTML+=text[i];
        i++;
        if(i>=text.length){
            clearInterval(typing);
            setTimeout(enterStore,1000);
        }
    },100);
}

function enterStore(){
    document.getElementById("entry").style.display="none";
    document.getElementById("store").style.display="block";
}

/* CART */
function addCart(name,price){
    cart.push({name,price});
    total+=price;
    updateCart();
}

function updateCart(){
    document.getElementById("cartCount").innerText=cart.length;
    document.getElementById("total").innerText=total;
    document.getElementById("cartTotal").innerText=total;

    let list=document.getElementById("cartItems");
    list.innerHTML="";

    cart.forEach((item,index)=>{
        let li=document.createElement("li");
        li.innerHTML=`${item.name} - KES ${item.price} 
        <button onclick="removeItem(${index})">X</button>`;
        list.appendChild(li);
    });
}

function removeItem(index){
    total-=cart[index].price;
    cart.splice(index,1);
    updateCart();
}

function toggleCart(){
    let box=document.getElementById("cartBox");
    box.style.display=box.style.display==="none"?"block":"none";
}

/* M-PESA (WHATSAPP) */
function checkout(){
    if(cart.length===0){
        alert("Cart is empty");
        return;
    }

    let message="IRONVOW ORDER:%0A";

    cart.forEach(item=>{
        message+=item.name+" - KES "+item.price+"%0A";
    });

    message+="%0ATotal: KES "+total;

    window.open("https://wa.me/254799218520?text="+message,"_blank");
}
</script>

</body>
</html>
